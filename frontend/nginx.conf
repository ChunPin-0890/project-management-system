server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the backend container, stripping the /api prefix.
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_set_header Host $host;
  }

  # SPA fallback for Angular's client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
